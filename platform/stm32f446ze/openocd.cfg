# NUCLEO-F446ZE board-level OpenOCD entry.
#
# OpenOCD's st_nucleo_f4 board script owns the low-level details for the
# on-board ST-LINK, SWD transport, STM32F4 target and reset wiring. Keeping
# this single indirection in platform/ prevents experiments from duplicating
# board/debug-probe knowledge.

source [find board/st_nucleo_f4.cfg]
